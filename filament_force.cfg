# filament_force example
#
# Copy this file into printer_data/config and add to printer.cfg:
#   [include filament_force.cfg]
#
# Needs a load cell extra (Kalico [load_cell_probe] or [load_cell]).
#
# Toolchanger: call _FF_TC_BEGIN before park/pickup, and
# _FF_TC_END TOOL={t} after a successful pickup. On INDX that is the
# start of CHANGE_TOOL / PARK_TOOL and the end of _RECORD_TOOLCHANGE.
#
# If your RESUME wrapper does extra work, add:
#   {% if printer.filament_force.pending_recheck|int == 1 %}
#       FILAMENT_FORCE_RESUME
#   {% endif %}

[filament_force]
continuous_detection: True
sensor: load_cell_probe
#extruder: extruder
oh_shit_force: 4000
#   Absolute |F-ref| grams. After jam_dwell_s above this, pause as jam
#   even if the e-speed bin is unlearned.
#   Cal: FILAMENT_FORCE_CAL_OH_SHIT then SAVE_CONFIG.
#jam_dwell_s: 0.15
#baseline_time: 0.15

#detection_length: 7.0
#min_e_speed: 0.5
#speed_bins: 1.0, 2.0, 4.0, 7.0
#idle_reset_s: 0.3
#min_learn_s: 1.5
#drop_ratio: 0.35
#runout_max_level_g: 80.0
#confirm_windows: 3
#recover_windows: 2
#history_n: 16
#min_learn_windows: 5
#high_sigma: 4.0
#min_delta_g: 15.0
#rolling_window: 0.05
#poll_interval_ms: 250

#probe_retract_mm: 3.0
#probe_extra_prime_mm: 0.2
#probe_spike_g: 50.0
#probe_feedrate: 30.0

#quiet: False
#debug_log: False

# Optional. params: TOOL, REASON, MSG, TARGET.
#runout_gcode:
#    RESPOND MSG="filament_force runout T{params.TOOL}"
#jam_gcode:
#    RESPOND MSG="filament_force jam T{params.TOOL}"
#recover_gcode:
#resume_gcode:

[gcode_macro _FF_TC_BEGIN]
description: Call before park or pickup
gcode:
    FILAMENT_FORCE_SUPPRESS ENABLE=1

[gcode_macro _FF_TC_END]
description: Call after a successful pickup. Pass TOOL=<n>.
gcode:
    {% if 'TOOL' in params %}
        FILAMENT_FORCE_SET_TOOL TOOL={params.TOOL|int}
    {% endif %}
    FILAMENT_FORCE_SUPPRESS ENABLE=0
